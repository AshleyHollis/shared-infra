apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-fabric
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nginx/nginx-gateway-fabric
    targetRevision: v1.5.0
    path: charts/nginx-gateway-fabric
    helm:
      releaseName: nginx-gateway-fabric
      values: |
        nginxGateway:
          replicaCount: 1
          image:
            repository: ghcr.io/nginxinc/nginx-gateway-fabric
            tag: 1.5.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        nginx:
          image:
            repository: ghcr.io/nginxinc/nginx-gateway-fabric/nginx
            tag: 1.5.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        service:
          type: ClusterIP
          ports:
            - port: 80
              targetPort: 80
              protocol: TCP
              name: http
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
