apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: meal-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: meal-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: meal-planner
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: web
          image: acrytsummprdci.azurecr.io/meal-planner-web:prod-20260614-152316-a1d923af
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: meal-planner-config
          env:
            - name: MEAL_PLANNER_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: meal-planner-runtime
                  key: MEAL_PLANNER_BASIC_AUTH_USER
            - name: MEAL_PLANNER_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meal-planner-runtime
                  key: MEAL_PLANNER_BASIC_AUTH_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
