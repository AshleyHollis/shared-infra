apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: meal-planner
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: meal-planner
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
