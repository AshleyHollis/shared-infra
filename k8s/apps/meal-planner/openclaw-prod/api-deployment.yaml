apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: meal-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: meal-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: meal-planner
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: acrytsummprdci.azurecr.io/meal-planner-api:prod-20260614-182940-85b5f480
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: meal-planner-config
          env:
            - name: MEAL_PLANNER_DB_PATH
              value: /data/inventory.sqlite
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: meal-planner-runtime
                  key: AUTH0_DOMAIN
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: meal-planner-runtime
                  key: AUTH0_CLIENT_ID
            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: meal-planner-runtime
                  key: AUTH0_CLIENT_SECRET
            - name: AUTH0_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: meal-planner-runtime
                  key: AUTH0_SESSION_SECRET
            - name: MEAL_PLANNER_AUTH_ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: meal-planner-runtime
                  key: MEAL_PLANNER_AUTH_ALLOWED_EMAILS
            - name: OPENCLAW_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meal-planner-runtime
                  key: OPENCLAW_APP_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: meal-planner-data
