apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meal-planner-runtime
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: meal-planner
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: meal-planner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-cluster
    kind: ClusterSecretStore
  target:
    name: meal-planner-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AUTH0_DOMAIN
      remoteRef:
        key: auth0-domain
    - secretKey: AUTH0_CLIENT_ID
      remoteRef:
        key: auth0-client-id
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef:
        key: auth0-client-secret
    - secretKey: AUTH0_SESSION_SECRET
      remoteRef:
        key: auth0-session-secret
    - secretKey: MEAL_PLANNER_AUTH_ALLOWED_EMAILS
      remoteRef:
        key: meal-planner-auth-allowed-emails
    - secretKey: OPENCLAW_APP_TOKEN
      remoteRef:
        key: meal-planner-openclaw-app-token
    - secretKey: AZURE_STORAGE_CONNECTION_STRING
      remoteRef:
        key: meal-planner-storage-connection
