apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meal-planner-runtime
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: meal-planner
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: meal-planner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-cluster
    kind: ClusterSecretStore
  target:
    name: meal-planner-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MEAL_PLANNER_BASIC_AUTH_USER
      remoteRef:
        key: meal-planner-basic-auth-user
    - secretKey: MEAL_PLANNER_BASIC_AUTH_PASSWORD
      remoteRef:
        key: meal-planner-basic-auth-password
    - secretKey: OPENCLAW_APP_TOKEN
      remoteRef:
        key: meal-planner-openclaw-app-token
