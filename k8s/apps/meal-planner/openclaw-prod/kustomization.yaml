apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meal-planner

resources:
  - namespace.yaml
  - configmap.yaml
  - externalsecret-runtime.yaml
  - pvc.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - web-httproute.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/platform: openclaw
      environment: production
