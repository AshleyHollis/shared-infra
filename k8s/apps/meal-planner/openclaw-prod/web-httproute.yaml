apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-httproute
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: meal-planner
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-system
      sectionName: http-meal-planner-prod
  hostnames:
    - meal-planner.ashleyhollis.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
          weight: 100
