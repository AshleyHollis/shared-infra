apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acr-pull-secret-source
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: yt-summarizer
    app.kubernetes.io/component: image-pull
spec:
  # ACRAccessToken emits short-lived pull credentials, so keep the source
  # secret well inside the token expiry window.
  refreshInterval: 1h
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ACRAccessToken
          name: ytsumm-acr-pull
  target:
    name: acr-pull-secret-source
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "acrytsummprdci.azurecr.io": {
                "username": "{{ .username }}",
                "password": "{{ .password }}"
              }
            }
          }
