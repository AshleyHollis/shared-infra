apiVersion: v1
kind: ServiceAccount
metadata:
  name: acr-source-reader
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: yt-summarizer
    app.kubernetes.io/component: image-pull
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acr-source-reader
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: yt-summarizer
    app.kubernetes.io/component: image-pull
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acr-source-reader
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: yt-summarizer
    app.kubernetes.io/component: image-pull
subjects:
  - kind: ServiceAccount
    name: acr-source-reader
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acr-source-reader
