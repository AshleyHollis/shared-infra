name: 'Terraform Plan'
description: 'Runs terraform plan and captures output for PR comments'
inputs:
  working-directory:
    description: 'Working directory for terraform commands'
    required: true
  subscription-id:
    description: 'Azure subscription ID'
    required: true
  sql-admin-password:
    description: 'SQL admin password'
    required: false
    default: ''
  openai-api-key:
    description: 'OpenAI API key'
    required: false
    default: ''
  cloudflare-api-token:
    description: 'Cloudflare API token'
    required: false
    default: ''
  cloudflare-account-id:
    description: 'Cloudflare account ID'
    required: false
    default: ''
  cloudflare-zone-id:
    description: 'Cloudflare zone ID'
    required: false
    default: ''
  enable-openclaw-tunnel:
    description: 'Whether to manage OpenClaw Cloudflare Tunnel resources'
    required: false
    default: ''
  openclaw-arc-oidc-issuer-url:
    description: 'Azure Arc OIDC issuer URL for the OpenClaw K3s cluster'
    required: false
    default: ''
outputs:
  plan_output:
    description: 'Raw terraform plan output'
    value: ${{ steps.plan.outputs.plan_output }}
  plan_json_path:
    description: 'Absolute path to plan.json on disk (avoids GITHUB_OUTPUT size limits)'
    value: ${{ steps.format.outputs.plan_json_path }}
  plan_summary:
    description: 'JSON summary of plan changes'
    value: ${{ steps.format.outputs.plan_summary }}
  outcome:
    description: 'Plan outcome (success/failure)'
    value: ${{ steps.plan.outcome }}
runs:
  using: composite
  steps:
    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false -no-color

    - name: Run terraform plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        SQL_ADMIN_PASSWORD: ${{ inputs.sql-admin-password }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_ZONE_ID: ${{ inputs.cloudflare-zone-id }}
        ENABLE_OPENCLAW_TUNNEL: ${{ inputs.enable-openclaw-tunnel }}
        OPENCLAW_ARC_OIDC_ISSUER_URL: ${{ inputs.openclaw-arc-oidc-issuer-url }}
        AUTH0_DOMAIN: ${{ env.AUTH0_DOMAIN }}
      run: ${{ github.action_path }}/run-terraform-plan.sh

    - name: Get JSON plan
      id: format
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Always run to provide output even if plan failed
      # Returns empty summary with error flag if tfplan doesn't exist
      run: ${{ github.action_path }}/parse-terraform-plan.sh
      continue-on-error: true
