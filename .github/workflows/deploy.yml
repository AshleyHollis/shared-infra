# =============================================================================
# Shared Infrastructure - Unified Deploy Pipeline
# =============================================================================
# Single pipeline for all shared infrastructure changes:
#   PR to main    → Terraform plan (post to PR) + K8s dry-run
#   Push to main  → Terraform plan + apply (if changes) → K8s deploy (ArgoCD)
#   Manual        → Terraform plan + optional apply → K8s deploy
#
# Replaces: deploy-infra.yml, terraform-plan.yml
# =============================================================================

name: Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/actions/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/actions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      run_apply:
        description: 'Apply terraform changes'
        required: false
        type: boolean
        default: false
      k8s_target:
        description: 'Kubernetes target for post-Terraform deploy steps'
        required: false
        type: choice
        options:
          - aks
          - openclaw
        default: aks
      enable_openclaw_tunnel:
        description: 'Manage OpenClaw Cloudflare Tunnel resources'
        required: false
        type: boolean
        default: false
      openclaw_arc_oidc_issuer_url:
        description: 'Azure Arc OIDC issuer URL for OpenClaw K3s'
        required: false
        type: string
        default: ''
      cloudflare_account_id:
        description: 'Cloudflare account ID override; falls back to repository variable'
        required: false
        type: string
        default: ''
      cloudflare_zone_id:
        description: 'Cloudflare zone ID override; falls back to repository variable'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Only one deploy at a time
concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Stage 1: Terraform Plan
  # ===========================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.parse-summary.outputs.has_changes }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform with Azure
        uses: ./.github/actions/setup-terraform-azure
        with:
          terraform-version: '1.12'
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load Cloudflare API token from Key Vault
        id: cloudflare-token
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.enable_openclaw_tunnel == true) ||
          vars.ENABLE_OPENCLAW_TUNNEL == 'true'
        shell: bash
        run: |
          token="$(az keyvault secret show \
            --vault-name "${{ vars.KEY_VAULT_NAME || 'kv-ytsumm-prd-ci' }}" \
            --name cloudflare-api-token \
            --query value \
            --output tsv)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: terraform
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          cloudflare-api-token: ${{ steps.cloudflare-token.outputs.token }}
          cloudflare-account-id: ${{ (github.event_name == 'workflow_dispatch' && inputs.cloudflare_account_id != '' && inputs.cloudflare_account_id) || vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-zone-id: ${{ (github.event_name == 'workflow_dispatch' && inputs.cloudflare_zone_id != '' && inputs.cloudflare_zone_id) || vars.CLOUDFLARE_ZONE_ID }}
          enable-openclaw-tunnel: ${{ (github.event_name == 'workflow_dispatch' && inputs.enable_openclaw_tunnel == true && 'true') || vars.ENABLE_OPENCLAW_TUNNEL }}
          openclaw-arc-oidc-issuer-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.openclaw_arc_oidc_issuer_url != '' && inputs.openclaw_arc_oidc_issuer_url) || vars.OPENCLAW_ARC_OIDC_ISSUER_URL }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Parse plan summary
        id: parse-summary
        shell: bash
        run: |
          HAS_CHANGES=$(echo '${{ steps.plan.outputs.plan_summary }}' | jq -r '.has_changes // false')
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "📋 Terraform has_changes=$HAS_CHANGES"

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-terraform-plan
        with:
          plan-summary: ${{ steps.plan.outputs.plan_summary }}
          plan-json-path: ${{ steps.plan.outputs.plan_json_path }}
          plan-outcome: ${{ steps.plan.outcome }}

      - name: Plan Status Check
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan artifact
        if: steps.parse-summary.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/plan_output.txt
            terraform/plan.json
          retention-days: 7

  # ===========================================================================
  # Stage 2: Terraform Apply (only when plan has changes)
  # ===========================================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      needs.terraform-plan.outputs.has_changes == 'true' &&
      needs.terraform-plan.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_apply == true))
    environment: production
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform with Azure
        uses: ./.github/actions/setup-terraform-azure
        with:
          terraform-version: '1.12'
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # ===========================================================================
  # Stage 3: Deploy K8s Infrastructure via ArgoCD
  # ===========================================================================
  deploy-k8s:
    name: Deploy K8s Infrastructure
    runs-on: ubuntu-latest
    needs: [terraform-plan, terraform-apply]
    # Run after terraform stages complete (apply may be skipped if no changes).
    # PRs always render manifests only. Pushes deploy to AKS unless the repo is
    # configured for the OpenClaw target; OpenClaw clusters pull via Argo CD.
    if: |
      always() &&
      needs.terraform-plan.result == 'success' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && vars.K8S_TARGET != 'openclaw') ||
        (github.event_name == 'workflow_dispatch' && inputs.k8s_target == 'aks')
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Azure and AKS
        uses: ./.github/actions/setup-azure-aks
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # On PR, only validate manifests (dry-run)
      - name: Validate K8s manifests (dry-run)
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Rendering K8s manifests without live cluster dependency ==="
          cat > k8s/argocd/kustomization.yaml <<'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - repo-secret.yaml
            - infra-apps.yaml
          EOF
          kubectl kustomize k8s/argocd >/dev/null

          cat > k8s/argocd/kustomization.yaml <<'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - infra-apps-openclaw.yaml
          EOF
          kubectl kustomize k8s/argocd >/dev/null
          kubectl kustomize k8s/argocd/gateway-api-openclaw >/dev/null
          kubectl kustomize k8s/argocd/cloudflare-tunnel >/dev/null
          kubectl kustomize k8s/cluster-resources-openclaw >/dev/null
          echo "✅ All manifests are valid"

      # On push/dispatch, actually deploy
      - name: Apply repo secret
        if: github.event_name != 'pull_request'
        run: kubectl apply -f k8s/argocd/repo-secret.yaml

      - name: Apply infrastructure applications
        if: github.event_name != 'pull_request'
        run: kubectl apply -f k8s/argocd/infra-apps.yaml

      - name: Wait for gateway-api sync
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/argocd-wait
        with:
          app-name: gateway-api
          namespace: gateway-system
          max-wait-seconds: '300'
          cleanup-stuck-operations: 'true'
          auto-recovery: 'true'

      - name: Wait for certificates sync
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/argocd-wait
        with:
          app-name: certificates
          namespace: gateway-system
          max-wait-seconds: '120'

      - name: Wait for external-dns sync
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/argocd-wait
        with:
          app-name: external-dns
          namespace: gateway-system
          max-wait-seconds: '120'

      - name: Verify all infrastructure applications
        if: github.event_name != 'pull_request'
        run: |
          echo "=== Final Infrastructure Status ==="
          kubectl get applications -n argocd -o custom-columns=\
          'NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status'

      - name: Collect diagnostics on failure
        if: failure() && github.event_name != 'pull_request'
        uses: ./.github/actions/collect-deployment-diagnostics
        with:
          app-name: gateway-system
          artifact-name: infra-deploy-diagnostics
